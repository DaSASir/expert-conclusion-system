<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Все документы (Админ)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Экспертное заключение</h1>
    <hr>

    <p>
        <strong>Администратор:</strong> <span id="userName">Не авторизован</span>
        <button onclick="logout()">Выйти</button>
    </p>

    <hr>

    <h2>Все документы пользователей</h2>

    <p>
        <strong>Фильтр по статусу:</strong>
        <select id="statusFilter" onchange="loadAllDocuments()">
            <option value="">Все</option>
            <option value="in_review">На проверке</option>
            <option value="ready_to_sign">Готов к подписанию</option>
            <option value="signed">Подписан</option>
            <option value="rejected">Отклонен</option>
        </select>
        <button onclick="loadAllDocuments()">Обновить</button>
    </p>

    <div id="documentsList">
        <p>Загрузка...</p>
    </div>

    <script src="js/common.js"></script>
    <script src="js/dashboard_admin.js"></script>

</body>
</html>
